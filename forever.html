<!DOCTYPE html>
<html>
<head>
  <title>Forever 🌹</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #fff0f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #ff3366;
      font-size: 34px;
      margin-bottom: 20px;
    }

    .flower {
      font-size: 100px;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0); }
    }

    p {
      font-size: 18px;
      color: #555;
    }
  </style>
  .heart {
  display: inline-block;
  animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
  0% { transform: scale(1); }
  30% { transform: scale(1.3); }
  60% { transform: scale(1); }
  100% { transform: scale(1); }
}
</head>

<body>

<h1>I LOVE YOU BABE FOREVER <span class="heart"> 💖</span>span></h1>

<div class="flower">🌹</div>

<p>Till this flower dies… (it will never..... 😌)</p>

</body>
</html>
